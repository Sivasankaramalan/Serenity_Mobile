# Driver configuration
webdriver.driver=appium

# Appium capabilities
appium.hub=http://localhost:4723/wd/hub
appium.platformName=Android
appium.deviceName=YourDeviceName
appium.automationName=UiAutomator2
appium.appPackage=com.act.mobile.apps
appium.appActivity=com.act.mobile.apps.MainActivity
appium.noReset=false
appium.autoLaunch=true
appium.newCommandTimeout=300
appium.autoGrantPermissions=true

# Add this if you have the APK file path
# appium.app=/path/to/your/app.apk

# Important: Set this to ensure shared driver instance
serenity.share.webdriver=true

# Serenity configuration
serenity.project.name=Serenity Mobile Automation
serenity.take.screenshots=FOR_FAILURES
serenity.console.colors=true
serenity.logging=VERBOSE
serenity.verbose.steps=true

# WebDriver timeout
serenity.timeout=30000
webdriver.timeouts.implicitlywait=10000
webdriver.wait.for.timeout=15000