# Serenity configuration
serenity.project.name=Mobile Automation
serenity.take.screenshots=FOR_FAILURES
serenity.console.colors=true
serenity.logging=VERBOSE

# Driver configuration
webdriver.driver=appium
appium.automationName=UiAutomator2
webdriver.timeouts.implicitlywait=5000
webdriver.wait.for.timeout=10000

# Disable Serenity's built-in driver management since we're handling it ourselves
serenity.driver.capabilities.provided=true

# Ensure we don't share driver between tests
serenity.maintain.session=false

# Disable parallel execution within a single JVM as we're using separate processes
cucumber.execution.parallel.enabled=false

# Feature file discovery
serenity.test.root=mobile

# Report configuration
serenity.reports.show.step.details=true
serenity.report.formats=html
serenity.report.encoding=UTF-8

# Test data handling
serenity.data.dir=src/test/resources/data

# Screenshot configuration
serenity.screenshooter=normal
serenity.compress.screenshots=false

# Logging configuration
serenity.verbose.steps=true
serenity.console.headings=normal