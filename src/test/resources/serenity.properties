# Serenity configuration
serenity.project.name=Mobile Automation
serenity.take.screenshots=FOR_FAILURES
serenity.console.colors=true
serenity.logging=NORMAL

# Driver configuration
webdriver.driver=provided
webdriver.provided.type=mobile.config.MobileDriverSource
webdriver.timeouts.implicitlywait=5000
webdriver.wait.for.timeout=10000

# Parallel execution
serenity.thread.count=2
serenity.maintain.session=true

# Cucumber parallel execution
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=2

# Feature file discovery
serenity.test.root=mobile