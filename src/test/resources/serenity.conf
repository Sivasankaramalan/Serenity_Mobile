webdriver {
  driver = appium
  timeouts {
    implicitlywait = 5000
    fluentwait = 10000
  }
}

appium {
  hub = "http://localhost:4723/wd/hub"

  # Default capabilities for all platforms
  noReset = true
  autoLaunch = true
  newCommandTimeout = 300
  autoGrantPermissions = true

  # Android-specific capabilities
  android {
    platformName = "Android"
    deviceName = "Android Device"
    automationName = "UiAutomator2"
    appWaitPackage = "com.example.android"
    appWaitActivity = "com.example.android.MainActivity"
  }

  # iOS-specific capabilities
  ios {
    platformName = "iOS"
    deviceName = "iPhone Simulator"
    automationName = "XCUITest"
    bundleId = "com.example.ios"
  }
}

# Environment-specific configuration
environments {
  default {
    webdriver.base.url = "http://localhost"
  }

  dev {
    appium.android.appWaitPackage = "com.example.android.dev"
    appium.ios.bundleId = "com.example.ios.dev"
  }

  qa {
    appium.android.appWaitPackage = "com.example.android.qa"
    appium.ios.bundleId = "com.example.ios.qa"
  }

  uat {
    appium.android.appWaitPackage = "app.mobile.qa"
    appium.ios.bundleId = "com.internal.test"
  }
}

serenity {
  take.screenshots = FOR_FAILURES
  report.encoding = "UTF-8"
  test.root = "mobile.steps"
  logging = VERBOSE
  restart.browser.for.each = NEVER
}