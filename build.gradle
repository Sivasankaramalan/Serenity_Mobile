plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '4.2.22'
}

repositories {
    mavenCentral()
}

ext {
    serenityVersion = '3.6.21'
    serenityCucumberVersion = '3.6.21'
    appiumVersion = '8.5.1'
}

dependencies {
    // Serenity dependencies
    implementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-cucumber:${serenityCucumberVersion}"
    implementation "net.serenity-bdd:serenity-junit:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-ensure:${serenityVersion}"

    // Appium
    implementation "io.appium:java-client:${appiumVersion}"

    // Cucumber
    implementation 'io.cucumber:cucumber-java:7.12.1'
    implementation 'io.cucumber:cucumber-junit:7.12.1'

    // JSON handling
    implementation 'org.json:json:20230227'

    // JUnit
    implementation 'junit:junit:4.13.2'

    // SLF4J
    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'org.slf4j:slf4j-simple:2.0.7'
}

test {
    systemProperties = System.properties

    // Configure parallel execution through system properties
    systemProperty 'cucumber.execution.parallel.enabled', 'false'

    // Appium capabilities
    systemProperty 'appium.automationName', 'UiAutomator2'

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams true
    }
}

serenity {
    testRoot = "mobile"
    requirementsDir = "src/test/resources/features"
    reports = ["single-page-html"]
}

gradle.startParameter.continueOnFailure = true